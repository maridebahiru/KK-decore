      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "KK Decor and Event",
        "description": "Professional event planning and decoration company specializing in weddings, engagements, corporate events, cultural celebrations, stage design, and floral arrangements.",
        "sameAs": [
          "https://www.tiktok.com/@kk_decorandevent"
        ],
        "serviceType": [
          "Wedding Planning & Decoration",
          "Engagement Ceremonies",
          "Corporate Events",
          "Birthday Celebrations",
          "Traditional & Cultural Events",
          "Stage Decoration",
          "Venue Decoration",
          "Floral Arrangements",
          "Event Planning & Coordination"
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var storedMode = localStorage.getItem('kk-decor-theme');
          var storedStyle = localStorage.getItem('kk-decor-style');
          var validStyles = ['royal-gold', 'garden-bloom', 'midnight-gala', 'modern-minimal'];
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedMode === 'dark' || (!storedMode && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          if (storedStyle && validStyles.indexOf(storedStyle) !== -1) {
            document.documentElement.setAttribute('data-style', storedStyle);
          } else {
            document.documentElement.setAttribute('data-style', 'royal-gold');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
