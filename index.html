    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "KK Decor and Event",
        "description": "Professional event planning and decoration company specializing in weddings, engagements, corporate events, cultural celebrations, stage design, and floral arrangements.",
        "sameAs": [
          "https://www.tiktok.com/@kk_decorandevent"
        ],
        "serviceType": [
          "Wedding Planning & Decoration",
          "Engagement Ceremonies",
          "Corporate Events",
          "Birthday Celebrations",
          "Traditional & Cultural Events",
          "Stage Decoration",
          "Venue Decoration",
          "Floral Arrangements",
          "Event Planning & Coordination"
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kk-decor-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#FAF8F4] text-[#202020] dark:bg-[#151515] dark:text-white antialiased selection:bg-[#541C2B] selection:text-white dark:selection:bg-[#C5A46D] dark:selection:text-[#151515]">
